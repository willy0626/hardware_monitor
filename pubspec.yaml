name: hardware_monitor
description: "A Flutter app for monitoring phone hardware."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^11.3.0
  battery_plus: ^7.1.2
  fl_chart: ^0.70.2
  cupertino_icons: ^1.0.8
  shizuku_api_plugin: ^1.0.4
  http: ^1.5.0
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
